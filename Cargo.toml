[package]
name = "attestation-proxy"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal", "net", "io-util", "fs"] }
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
base64 = "0.23.1"
regex = "1.13.1"
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
percent-encoding = "2.3.2"
argon2 = "0.6.0"
hkdf = "0.13.0"
sha2 = "0.11.0"
zeroize = { version = "1.9.0", features = ["derive", "serde"] }
thiserror = "2.0.20"
aes-gcm = "0.11.1"
rand = "0.10.2"
ed25519-dalek = "3.0.0"
bip39 = { version = "2.2.2", default-features = false, features = ["std"] }
libc = "0.2.189"
rcgen = "0.14.10"
rustls = { version = "0.23.44", default-features = false, features = ["std", "aws_lc_rs"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
x509-cert = "0.3.0"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
