name: Build Attestation Proxy

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Optional additional image tag to publish, for example v2.1.12"
        required: false
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      MUSL_TARGET: x86_64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          IMAGE: ghcr.io/enclava-labs/attestation-proxy
          VERSION_TAG: ${{ github.event.inputs.version_tag }}
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE}:v2"
            if [ -n "${VERSION_TAG}" ]; then
              echo "${IMAGE}:${VERSION_TAG}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build image locally for size gate
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            MUSL_TARGET=${{ env.MUSL_TARGET }}

      - name: Enforce image size under 16MiB
        run: |
          SIZE_BYTES="$(docker image inspect 'ghcr.io/enclava-labs/attestation-proxy:v2' --format '{{.Size}}')"
          echo "attestation-proxy image size: ${SIZE_BYTES} bytes"
          if [ "${SIZE_BYTES}" -ge 16777216 ]; then
            echo "BUILD-03 failure: image size ${SIZE_BYTES} bytes is >= 16777216"
            exit 1
          fi

      - name: Push image to GHCR
        id: push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            MUSL_TARGET=${{ env.MUSL_TARGET }}
          provenance: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign pushed digest
        env:
          IMAGE: ghcr.io/enclava-labs/attestation-proxy
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
